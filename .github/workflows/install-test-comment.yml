name: Install test comment

# Posts the install test's numbers on the pull request as one comment, kept
# up to date on every run, next to quattro's latest numbers. GitHub runs
# workflow_run workflows from the default branch, with write access even for
# pull requests from forks, so this job never checks out or runs pull request
# code: it only reads the finished run's artifact, as data.

on:
  workflow_run:
    workflows: ["Install test"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      # A rerun keeps earlier attempts' artifacts under the same run, so take
      # exactly the attempt that finished. The baseline is quattro's last five
      # green runs: hosted runners differ enough that one run of the same code
      # can take twice as long as the next, so a single run is no baseline.
      - name: Fetch this run's numbers and quattro's recent ones
        env:
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          gh run download "$RUN_ID" -R "$REPO" -n "install-test-$RUN_ID-$ATTEMPT" -D pr || true
          gh run list -R "$REPO" --workflow install-test.yml --branch quattro --event push \
            --status success -L 5 --json databaseId -q '.[].databaseId' |
            while read -r base; do
              base_attempt=$(gh api "repos/$REPO/actions/runs/$base" -q .run_attempt)
              gh run download "$base" -R "$REPO" -n "install-test-$base-$base_attempt" -D "base/$base" || true
            done

      - name: Comment on the pull request
        run: |
          set -euo pipefail
          marker='<!-- omarchy-install-test -->'

          # The number comes from the pull request's own run, so trust it only
          # when that pull request's head is the commit this run tested.
          pr=$({ find pr -name pr-number -exec cat {} + 2>/dev/null || true; } | head -1 | tr -dc 0-9)
          [ -n "$pr" ] || { echo "No pull request number in the artifact"; exit 0; }
          [ "$(gh api "repos/$REPO/pulls/$pr" -q .head.sha)" = "$HEAD_SHA" ] ||
            { echo "PR #$pr has moved past $HEAD_SHA; not commenting"; exit 0; }

          # Every lookup prints nothing rather than failing, so a missing number shows
          # as "–" instead of ending the script under set -e.
          timing() { { find "$1" -name omarchy-install-timing.json 2>/dev/null || true; } | head -1; }
          install_s() { [ -n "$1" ] || return 0; jq -r '.finished_at - .started_at' "$1" 2>/dev/null || true; }
          # "Startup finished in … = 1min 2.3s" or "= 12.104s" -> seconds
          boot_s() {
            local f
            f=$({ find "$1" -path "$2" 2>/dev/null || true; } | head -1)
            [ -n "$f" ] || return 0
            head -1 "$f" | sed -n 's/.*= *//p' |
              awk '{t=0; for (i=1;i<=NF;i++) { if ($i ~ /min$/) t+=60*$i; else if ($i ~ /ms$/) t+=$i/1000; else t+=$i } printf "%.3f", t}'
          }
          metric() { # run directory, metric name
            case $2 in
            Install) install_s "$(timing "$1")" ;;
            "First boot") boot_s "$1" '*/first-boot-systemd-analyze.txt' ;;
            "Everyday boot") boot_s "$1" '*-boot/systemd-analyze.txt' ;;
            esac
          }
          # "median min max count" of the numbers on stdin; nothing when there are none.
          spread() {
            sort -n | awk 'NF {v[++n]=$1} END {if (n) printf "%s %s %s %d", (n%2 ? v[(n+1)/2] : (v[n/2]+v[n/2+1])/2), v[1], v[n], n}'
          }
          secs() { [ -n "$1" ] && awk -v x="$1" 'BEGIN{printf "%.1f s", x}' || echo "–"; }

          runs=0
          {
            echo "$marker"
            status="passed"; [ "$CONCLUSION" = success ] || status="**${CONCLUSION}**"
            echo "### Install test $status"
            echo
            echo "| | This PR | quattro, median | quattro, range | |"
            echo "| --- | ---: | ---: | ---: | --- |"
            for name in "Install" "First boot" "Everyday boot"; do
              this=$(metric pr "$name")
              read -r median low high count < <(for d in base/*/; do [ -d "$d" ] && metric "$d" "$name"; echo; done | spread; echo) || true
              [ "${count:-0}" -gt "$runs" ] && runs=$count
              verdict=""
              if [ -n "$this" ] && [ "${count:-0}" -ge 3 ]; then
                verdict=$(awk -v t="$this" -v lo="$low" -v hi="$high" 'BEGIN{ if (t > hi) printf "slower than every baseline run"; else if (t < lo) printf "faster than every baseline run"; else printf "within the range" }')
              fi
              range="–"; [ -n "${median:-}" ] && range="$(secs "$low") – $(secs "$high")"
              echo "| $name | $(secs "$this") | $(secs "${median:-}") | $range | $verdict |"
            done
            echo
            if [ "$runs" -ge 3 ]; then
              echo "Baseline: quattro's last $runs green runs. Hosted runners vary a lot between runs of the same code, so only a result outside the range says something."
            else
              echo "Baseline: $runs green run(s) on quattro so far, too few to judge against. Hosted runners vary a lot between runs of the same code."
            fi
            pt=$(timing pr)
            if [ -n "$pt" ]; then
              echo
              echo "<details><summary>Install phases of this run</summary>"
              echo
              echo "| Phase | Seconds |"
              echo "| --- | ---: |"
              # Phase names come from the pull request's installer: keep them to plain text.
              jq -r '.phases[] | "| \(.name | gsub("[^A-Za-z0-9 +&/().-]"; "") | .[0:60]) | \(.elapsed * 10 | round / 10) |"' "$pt"
              echo
              echo "</details>"
            fi
            echo
            echo "[Run]($RUN_URL) · ${HEAD_SHA:0:8}"
          } > comment.md

          existing=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh api "repos/$REPO/issues/$pr/comments" -F body=@comment.md >/dev/null
          fi
          cat comment.md
