name: Install test

# Builds the ISO a pull request produces once, then installs it unattended in
# KVM guests, one job per variant: the default install and the encrypted one
# run every scenario in test/integration.d/, the others install a machine the
# default does not cover (another keyboard, a small disk, little memory, BIOS
# firmware, a slow medium) and run the scenarios that concern it. The default
# variant's install and boot times are what every later change is measured
# against in its own PR.

on:
  pull_request:
  # Each merge records quattro's numbers, which PR comments compare against.
  push:
    branches: [quattro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      # The hosted runner has far more disk than the build needs (145 GB,
      # ~86 GB free); fail early and loudly if that ever changes.
      - name: Check disk space
        run: |
          df -h /
          avail_gb=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          [ "$avail_gb" -ge 40 ] || { echo "::error::only ${avail_gb} GB free, the ISO build needs ~40 GB"; exit 1; }

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build the ISO
        run: NO_BOOT_OFFER=1 ./bin/omarchy-iso-make

      # Already compressed, and only the jobs below read it.
      - name: Hand the ISO to the install jobs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: iso-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*.iso
          compression-level: 0
          retention-days: 1

  install:
    name: ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # scenarios: the test/integration.d/ scenarios to run after the
        # install; empty runs all of them. options go to test/integration,
        # env to the harness (OMARCHY_INTEGRATION_*, base-test.sh).
        include:
          - variant: default
          - variant: encrypted
            env: OMARCHY_INTEGRATION_ENCRYPT=true
          - variant: kb-uk
            scenarios: boot keymap-locale
            env: OMARCHY_INTEGRATION_KB_LAYOUT=uk
          - variant: encrypted-kb-uk
            scenarios: boot keymap-locale
            env: OMARCHY_INTEGRATION_ENCRYPT=true OMARCHY_INTEGRATION_KB_LAYOUT=uk
          - variant: small-disk
            scenarios: boot
            env: OMARCHY_INTEGRATION_DISK_GB=24
          - variant: low-memory
            scenarios: boot
            memory: 4096
          - variant: low-memory-encrypted
            scenarios: boot
            memory: 2048
            env: OMARCHY_INTEGRATION_ENCRYPT=true
          - variant: bios
            scenarios: boot firmware-boot
            options: --bios
          - variant: uki
            scenarios: boot
            env: OMARCHY_INTEGRATION_UKI=true
          # A 30 MiB/s medium, a USB 2 stick: the install is read-bound and
          # the image does not stay cached between the verify and the write.
          - variant: usb2-4g
            scenarios: noop
            memory: 4096
            env: OMARCHY_INTEGRATION_ENCRYPT=true OMARCHY_ISO_THROTTLE_BPS=31457280
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Fetch the ISO
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: iso-${{ github.run_id }}-${{ github.run_attempt }}
          path: release

      # The harness runs in an Arch container: Arch's current QEMU and OVMF
      # (QEMU 11) instead of Ubuntu 24.04's QEMU 8.2, at the paths the
      # harness expects, the same as on an Omarchy workstation.
      - name: Install unattended, then run the scenarios
        env:
          VARIANT: ${{ matrix.variant }}
          VARIANT_ENV: ${{ matrix.env }}
          SCENARIOS: ${{ matrix.scenarios }}
          OPTIONS: ${{ matrix.options }}
          MEMORY: ${{ matrix.memory || 8192 }}
        run: |
          sudo chmod 0666 /dev/kvm
          variant_env=()
          for setting in $VARIANT_ENV; do variant_env+=(-e "$setting"); done
          docker run --rm --device /dev/kvm -v "$PWD:/w" -w /w \
            -e OMARCHY_INTEGRATION_DISK_CACHE=none -e OMARCHY_INTEGRATION_DISCARD_DISKS=1 \
            -e OMARCHY_INTEGRATION_VARIANT="$VARIANT" -e SCENARIOS -e OPTIONS -e MEMORY \
            "${variant_env[@]}" \
            archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed qemu-system-x86 qemu-hw-display-virtio-gpu qemu-hw-display-virtio-vga qemu-img edk2-ovmf seabios socat \
                imagemagick tesseract tesseract-data-eng mtools dosfstools e2fsprogs parted libisoburn acpica cpio zstd file jq openssh openssl python curl >/dev/null
              # test/integration installs its tools through Omarchy'"'"'s helper; they are installed above.
              printf "#!/bin/sh\nexit 0\n" >/usr/local/bin/omarchy-pkg-add
              chmod 0755 /usr/local/bin/omarchy-pkg-add
              qemu-system-x86_64 --version | head -1
              # shellcheck disable=SC2086 # scenario names and options are separate words
              ./test/integration release/*.iso $SCENARIOS $OPTIONS --no-preview --memory "$MEMORY" --timeout 1800
            '

      # The harness ran as root in its container: test-runs and what QEMU
      # wrote there (the serial logs) belong to root until this step.
      - name: Hand the results to the runner's user
        if: always()
        run: |
          mkdir -p test-runs
          sudo chown -R "$(id -u):$(id -g)" test-runs

      - name: Report times
        if: always()
        run: |
          base=$(ls -d test-runs/*-integration* 2>/dev/null | head -1)
          [ -n "$base" ] || { echo "No test run to report" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## Install test: ${{ matrix.variant }}"
            echo
            if [ -f "$base/omarchy-install-timing.json" ]; then
              jq -r '"**Install:** \((.finished_at - .started_at) * 10 | round / 10) s across \(.phases | length) phases"' "$base/omarchy-install-timing.json"
              echo
              echo "| Phase | Seconds |"
              echo "| --- | ---: |"
              jq -r '.phases[] | "| \(.name) | \(.elapsed * 10 | round / 10) |"' "$base/omarchy-install-timing.json"
              echo
            fi
            if [ -f "$base/first-boot-systemd-analyze.txt" ]; then
              echo "**First boot:** $(head -1 "$base/first-boot-systemd-analyze.txt")"
              echo
            fi
            boot_dir=$(ls -d "$base"/runs/*-boot 2>/dev/null | tail -1)
            if [ -n "$boot_dir" ] && [ -f "$boot_dir/systemd-analyze.txt" ]; then
              echo "**Everyday boot:** $(head -1 "$boot_dir/systemd-analyze.txt")"
              echo
              echo "System state: $(jq -r .system_state "$boot_dir/boot-timing.json" 2>/dev/null)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The comment workflow runs from quattro and reads only this artifact;
      # it needs the PR number, which a workflow_run event omits for forks.
      - name: Record the pull request
        if: always() && github.event_name == 'pull_request' && matrix.variant == 'default'
        run: echo "${{ github.event.pull_request.number }}" > test-runs/pr-number

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # The comment workflow reads the default variant's artifact by this name.
          name: install-test-${{ matrix.variant != 'default' && format('{0}-', matrix.variant) || '' }}${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-runs/pr-number
            test-runs/*/omarchy-install-timing.json
            test-runs/*/omarchy-install.log
            test-runs/*/first-boot-systemd-analyze.txt
            test-runs/*/runs/**/*.png
            test-runs/*/runs/**/*.txt
            test-runs/*/runs/**/*.json
            test-runs/*/runs/**/*.log
          if-no-files-found: ignore
          retention-days: 14
